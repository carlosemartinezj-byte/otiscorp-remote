# Despliegue del relay de OtisCorp Remote en Fly.io.
# Puerto 443 con TLS (Fly lo termina en el borde -> el tramo por internet va
# cifrado) reenviando al relay interno en 8080. Puerto 5223 en claro para pruebas.
app = "otiscorp-relay"
primary_region = "dfw"

[build]

[[services]]
  internal_port = 8080
  protocol = "tcp"
  # El relay debe estar siempre disponible: no apagar la maquina por inactividad.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # UNA sola maquina, a proposito: el mapa `hosts` vive en el proceso. Con 2+
  # maquinas el HOST se registra en una y el JOIN cae en otra -> "El equipo no
  # esta conectado al servidor" intermitente. Limites altos para que Fly NO
  # arranque una segunda maquina por numero de conexiones.
  [services.concurrency]
    type = "connections"
    hard_limit = 2000
    soft_limit = 1800

  [[services.ports]]
    port = 443
    handlers = ["tls"]

  [[services.ports]]
    port = 5223
    handlers = []

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
