[package]
name = "otiscorp-remote"
version = "2.9.18"
description = "OtisCorp Remote — cliente de escritorio remoto ligero"
authors = ["OtisCorp"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Arranque automatico con Windows (acceso desatendido de verdad: si la PC se
# reinicia sola, la app tiene que estar corriendo para poder conectarse sin
# que alguien la abra a mano). Se registra en el Run key de Windows, no
# requiere permisos de administrador.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Codec ligero para compartir pantalla (MJPEG). jpeg-encoder es Rust puro (sin C).
jpeg-encoder = "0.6"
base64 = "0.22"
# Ajuste fino de sockets (SO_SNDBUF/SO_RCVBUF) para acotar el retraso: limita
# cuantos bytes de video pueden estar "en vuelo" a la vez.
socket2 = "0.5"
# TLS para el tunel por internet contra el relay (proveedor `ring`, sin C extra).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.3"
# Solo para apagar los atajos de teclado que WebView2 se reserva (ver
# disable_browser_accelerator_keys en main.rs). Ya es dependencia transitiva
# de tauri (via wry) -- se declara aqui para llamar directo a
# ICoreWebView2Controller/Settings.
webview2-com = "0.38"
# El trait Interface (de aqui sale `.cast()`) -- misma version 0.61 que usa
# webview2-com por debajo. Version de windows-core distinta a la de
# `windows = "0.58"` de abajo; conviven sin chocar, cada una en su propio
# nodo del grafo de dependencias.
windows-core = "0.61"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Media_MediaFoundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

# Optimizado para un binario pequeno y bajo consumo en reposo.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
