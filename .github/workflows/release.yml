name: Release

# Se dispara al subir un tag "vX.Y.Z" (ej: v2.5.0). Compila Windows y Mac,
# firma las actualizaciones, y publica un Release en GitHub con el .exe, el
# .dmg y el latest.json que el auto-updater de la app revisa al arrancar.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OtisCorp Remote ${{ github.ref_name }}"
          releaseBody: "Actualizacion automatica de OtisCorp Remote."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
