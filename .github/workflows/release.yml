name: Release

# Se dispara al subir un tag "vX.Y.Z" (ej: v2.6.0). Compila Windows, firma las
# actualizaciones, y publica un Release en GitHub con el .exe y el latest.json
# que el auto-updater de la app revisa al arrancar.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias npm
        run: npm install

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OtisCorp Remote ${{ github.ref_name }}"
          releaseBody: "Actualizacion automatica de OtisCorp Remote."
          releaseDraft: false
          prerelease: false
